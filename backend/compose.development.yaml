# Explicit development override. Do not combine with the public HTTPS profile.
services:
  extractor:
    image: ${FELT_DEV_IMAGE:-backend-extractor}
    environment:
      FELT_PUBLIC_BASE_URL: ${FELT_DEV_ORIGIN:?Set FELT_DEV_ORIGIN in the private development env file}
      FELT_DEVELOPMENT_TOKEN: ${FELT_DEVELOPMENT_TOKEN:?Set a random development access token}
    ports:
      - '${FELT_DEV_PORT:-80}:8787'
