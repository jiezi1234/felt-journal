<div class="absolute right-3 bottom-2.5 px-2 py-0.5 rounded bg-paper-surface/80 text-on-surface-variant font-label-sm text-label-sm tracking-widest shadow-sm pointer-events-none">

          </div>

<div class="px-margin mt-2 flex flex-col gap-2.5">

<button class="w-full h-12 bg-secondary text-paper-surface font-label-lg text-label-lg rounded-lg shadow-[0_3px_0_0_#205032] active:translate-y-0.5 active:shadow-[0_1px_0_0_#205032] transition-all flex items-center justify-center gap-2 cursor-pointer" id="saveAlbumBtn" type="button">

</button>

      </p>

<!-- 轻量轻提示 Toast (初始隐藏) -->
<div class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full shadow-lg flex items-center gap-2 text-body-sm font-body-sm opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 z-50" id="toastBox">
<span class="material-symbols-outlined text-[18px] text-secondary-fixed">check</span>
<span id="toastMsg">已保存至系统相册</span>
</div>
</div>
<script>
  (function() {
    const saveBtn = document.getElementById('saveAlbumBtn');
    const shareBtn = document.getElementById('shareFriendBtn');
    const toast = document.getElementById('toastBox');
    const toastMsg = document.getElementById('toastMsg');
    let toastTimeout;

    function showToast(text) {
      if (!toast) return;
      toastMsg.textContent = text;
      toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2200);
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        saveBtn.classList.add('opacity-90');
        setTimeout(() => saveBtn.classList.remove('opacity-90'), 150);
        showToast('已成功将胡桃木手账画保存到相册');
      });
    }

    if (shareBtn) {
      shareBtn.addEventListener('click', () => {
        if (navigator.share) {
          navigator.share({
            title: '收藏这一天 · 毛毡生活手账',
            text: '这是我今天拼贴的生活毛毡画，温暖定格。'
          }).catch(() => {});
        } else {
          showToast('已生成分享卡片链接');
        }
      });
    }
  })();
</script></main></body></html>
