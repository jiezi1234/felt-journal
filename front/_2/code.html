      const rotSign = rotation > 0 ? `+${rotation}` : `${rotation}`;
      statusText.textContent = `手冲咖啡 · 尺寸 ${Math.round(scale * 100)}% · 旋转 ${rotSign}°`;
    }

    const btnRotateCW = document.getElementById('btnRotateCW');
    const btnRotateCCW = document.getElementById('btnRotateCCW');
    const btnScaleUp = document.getElementById('btnScaleUp');
    const btnScaleDown = document.getElementById('btnScaleDown');
    const btnDelete = document.getElementById('btnDeleteCutout');

    if (btnRotateCW) {
      btnRotateCW.addEventListener('click', (e) => {
        e.stopPropagation();
        rotation = (rotation + 15) % 360;
        updateTransform();
      });
    }

    if (btnRotateCCW) {
      btnRotateCCW.addEventListener('click', (e) => {
        e.stopPropagation();
        rotation = (rotation - 15 + 360) % 360;
        updateTransform();
      });
    }

    if (btnScaleUp) {
      btnScaleUp.addEventListener('click', (e) => {
        e.stopPropagation();
        if (scale < 1.6) {
          scale = parseFloat((scale + 0.1).toFixed(2));
          updateTransform();
        }
      });
    }

    if (btnScaleDown) {
      btnScaleDown.addEventListener('click', (e) => {
        e.stopPropagation();
        if (scale > 0.6) {
          scale = parseFloat((scale - 0.1).toFixed(2));
          updateTransform();
        }
      });
    }

    if (btnDelete) {
      btnDelete.addEventListener('click', () => {
        if (wrapper) {
          wrapper.style.opacity = '0.3';
          statusText.textContent = '物件已移除';
          setTimeout(() => {
            wrapper.style.display = 'none';
          }, 200);
        }
      });
    }

    window.changeFeltColor = function(colorClass, buttonEl) {
      const surface = document.getElementById('feltBoardSurface');
      if (!surface) return;
      
      // 移除原有的毛毡颜色类
      surface.classList.remove('bg-felt-oatmeal', 'bg-secondary-fixed-dim', 'bg-surface-variant');
      surface.classList.add(colorClass);

      // 视觉状态切换
      document.querySelectorAll('.color-picker-btn').forEach(btn => {
        btn.classList.add('opacity-75');
        btn.classList.remove('shadow-inner', 'opacity-100');
      });
      if (buttonEl) {
        buttonEl.classList.remove('opacity-75');
        buttonEl.classList.add('shadow-inner', 'opacity-100');
      }
    };
  })();
</script></main>

</body></html>
